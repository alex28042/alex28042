name: Contribution snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#6e40c9&color_dots=#ebedf0,#e2d5fb,#c4a7f5,#a371f7,#6e40c9
            dist/snake-dark.svg?palette=github-dark&color_snake=#d2a8ff&color_dots=#161b22,#3b1f6e,#6e40c9,#8957e5,#d2a8ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
