name: Update README Stats

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch: # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update languages section
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/update-languages.py

      - name: Update activity section
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python scripts/update-commits.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: update stats" && git push)
